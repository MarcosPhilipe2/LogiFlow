name: Testes Python

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt
      - name: Executar testes
        env:
          DATABASE_URL: sqlite:///./logiflow_tests_ci.db
          JWT_SECRET_KEY: chave-de-teste-ci-com-comprimento-suficiente-12345
        run: python -m pytest -q
